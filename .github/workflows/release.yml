name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Check whether this version is tagged
      id: check
      run: |
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
          echo "v$version is already released"
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          echo "v$version is not tagged yet; releasing"
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --dev

    - name: Generate release notes
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: uv run git-cliff --tag "v${{ needs.check.outputs.version }}" --unreleased --strip all > RELEASE_NOTES.md

    - name: Build package
      run: uv build

    - name: Test package installation
      run: uv run --isolated --no-project --with dist/*.whl python -P -c "import beetsplug.quicktag; print('Package installed successfully')"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        attestations: true

    - name: Create GitHub release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: v${{ needs.check.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: |
          dist/*.whl
          dist/*.tar.gz
        draft: false
        prerelease: ${{ contains(needs.check.outputs.version, 'rc') || contains(needs.check.outputs.version, 'b') || contains(needs.check.outputs.version, 'a') }}
