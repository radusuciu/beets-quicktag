name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: |
        uv sync --dev
    
    - name: Generate changelog
      run: |
        uv run git-cliff --latest --strip header > RELEASE_NOTES.md
        uv run git-cliff --output CHANGELOG.md
    
    - name: Build package
      run: |
        uv build
    
    - name: Test package installation
      run: |
        uv run --isolated --no-project --with dist/*.whl python -P -c "import beetsplug.quicktag; print('Package installed successfully')"
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        files: |
          dist/*
        draft: false
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
    
    - name: Commit updated changelog
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git fetch origin main
        git checkout -- CHANGELOG.md
        git checkout -B main origin/main
        uv run git-cliff --output CHANGELOG.md
        git add CHANGELOG.md
        if git diff --staged --quiet; then echo "No changes to commit"; else
          git commit -m "docs: update changelog for ${{ github.ref_name }}"
          git push origin main
        fi